# 定时辩论 · Cursor / WorkBuddy 共用同一 execution_prompt

version: 1

automations:
  - id: truth-discovery-debate-loop
    name: "求真辨伪辩论·定时循环"
    schedule:
      rrule: "FREQ=HOURLY;INTERVAL=1"
      status: ACTIVE
    platform:
      match_name: "求真辨伪辩论·定时循环"

    bootstrap_prompt: |
      执行一轮求真辨伪辩论工作流（见本文件 execution_prompt）。

    execution_prompt: |
      在仓库根目录，按 .agents/RULES.md 与 .agents/debate-workflow.yaml 执行一整轮辩论（init-role-agents 解析步骤；不熟再 Read paths.yaml）。
      辩题：debates/topics.md 第一个行尾无 ✅；全无 ✅ 则结束。
      落盘、标 ✅、问询记录与 git（L9 roles/git.md）按工作流末步。

    platforms:
      workbuddy:
        trigger: "Recurring automation 按 schedule.rrule 唤醒新会话"
        human_sync:
          name: "求真辨伪辩论·定时循环"
          prompt: "本条目 bootstrap_prompt"
          rrule_status: "本条目 schedule"
        agent_on_wake:
          - "Read .agents/automations.yaml → execution_prompt"
          - "执行 debate-workflow.yaml 一整轮"

      cursor:
        trigger: "Cursor 专用 shell：.agents/cursor-loop.sh（monitored AGENT_LOOP_TICK；或 IDE /loop）"
        shell:
          script: ".agents/cursor-loop.sh"
          default_interval_seconds: 3600
          sentinel: "AGENT_LOOP_TICK_truth-discovery-debate"
          note: "仅 Cursor；Agent 后台启动并 notify_on_output；tick 后执行本文件 execution_prompt"
        human_sync:
          example: ".agents/cursor-loop.sh   # 或 /loop 3600m（二者勿并开）"
        agent_on_wake:
          - "Read .agents/automations.yaml → execution_prompt"
          - "执行 debate-workflow.yaml 一整轮"

    mutex: "WorkBuddy recurring 与 Cursor（cursor-loop.sh 或 /loop）勿同时启用"

out_of_scope:
  - name: "生成昨日 AI 重点资讯总结"
    reason: 非本仓库任务